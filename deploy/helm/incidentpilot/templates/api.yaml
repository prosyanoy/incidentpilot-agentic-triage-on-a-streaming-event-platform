apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "ip.labels" . | nindent 4 }}
spec:
  replicas: 1   # DuckDB is single-writer: one consumer owns the store
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: {{ .Release.Name }}-api }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-api }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
    spec:
      securityContext: { runAsUser: 10001, fsGroup: 10001, runAsNonRoot: true }
      containers:
        - name: api
          image: {{ include "ip.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-config }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "ip.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: { app: {{ .Release.Name }}-api }
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8000
      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
