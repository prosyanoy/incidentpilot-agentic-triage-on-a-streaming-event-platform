[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentpilot"
version = "0.1.0"
description = "Agentic incident triage on a streaming event platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "duckdb>=1.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "nats-py>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
incidentpilot = "incidentpilot.cli:main"

[tool.setuptools.packages.find]
include = ["incidentpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
